<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KVMem 聊天</title>
<style>
button{white-space:nowrap;flex-shrink:0}
:root{color-scheme:dark;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#101824;color:#e9f1f6}*{box-sizing:border-box}body{max-width:980px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:16px}h1{font-size:26px;margin:0 auto 0 0}button{background:#193534;color:#7ce5ca;border:1px solid #416567;border-radius:8px;padding:10px 18px;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:default}#prompt{background:#192534;border:1px solid #34495e;border-radius:10px;margin:18px 0;padding:12px 16px}#promptText{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;color:#9db1c0}summary{cursor:pointer;color:#36d3ae}#conversation{min-height:35vh}.message{margin:18px 0;padding:16px 20px;background:#192534;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#1c363a}.role{display:block;color:#91b9ba;font-size:13px;margin-bottom:6px}.reason{color:#9db1c0;font-size:14px}.reason pre{white-space:pre-wrap;font:inherit}form{position:sticky;bottom:0;background:#101824;padding:16px 0;display:flex;gap:12px}textarea{resize:vertical;width:100%;min-height:80px;max-height:40vh;font:inherit;background:#192534;color:inherit;border:1px solid #416567;border-radius:10px;padding:12px}#status{color:#9db1c0;min-height:26px}.empty{color:#9db1c0;padding:35px 0}small{color:#9db1c0}
</style>
<header><h1>KVMem 聊天</h1><button id="newChat">新对话</button></header>
<details id="prompt"><summary id="promptLabel">正在读取系统提示词…</summary><div id="promptText"></div><small>在桌面程序的“系统提示词”页编辑并保存；修改后建议开始新对话。</small></details>
<main id="conversation"><p class="empty" id="empty">发送消息开始聊天。对话仅保留在当前页面，刷新后清除。</p></main>
<div id="status" role="status"></div>
<form id="form"><textarea id="input" aria-label="消息" placeholder="输入消息；Enter 发送，Shift + Enter 换行" required></textarea><button id="send" type="submit">发送</button><button id="stop" type="button" hidden>停止</button></form>
<script>
const $=id=>document.getElementById(id);
let messages=[],controller=null;
async function config(){const r=await fetch('/desktop-config',{cache:'no-store'});const c=await r.json();if(!r.ok)throw Error(c.error||'读取配置失败');$('promptLabel').textContent=c.systemPrompt.trim()?'已启用默认系统提示词':'未设置默认系统提示词';$('promptText').textContent=c.systemPrompt||'（留空）';return c;}
config().catch(e=>$('status').textContent=e.message);
function bubble(role){$('empty')?.remove();const box=document.createElement('article');box.className='message '+role;const label=document.createElement('span');label.className='role';label.textContent=role==='user'?'你':'KVMem';box.append(label);const content=document.createElement('div');box.append(content);$('conversation').append(box);return {box,content};}
$('newChat').onclick=()=>{messages=[];$('conversation').replaceChildren();$('status').textContent='已开始新对话';config().catch(e=>$('status').textContent=e.message);$('input').focus();};
$('stop').onclick=()=>controller?.abort();
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!controller)$('form').requestSubmit();}};
$('form').onsubmit=async e=>{
 e.preventDefault();const text=$('input').value.trim();if(!text||controller)return;
 controller=new AbortController();$('send').disabled=true;$('newChat').disabled=true;$('stop').hidden=false;$('input').value='';$('status').textContent='正在生成…';
 bubble('user').content.textContent=text;const output=bubble('assistant');let content='',thinking='',reasonText;
 messages.push({role:'user',content:text});
 try{
  const c=await config();const response=await fetch('/v1/chat/completions',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({model:c.model,messages,stream:true,max_tokens:c.maxTokens})});
  if(!response.ok)throw Error((await response.text()).slice(0,1000));
  const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',done=false;
  function line(value){if(!value.startsWith('data:'))return;const data=value.slice(5).trim();if(data==='[DONE]'){done=true;return;}const event=JSON.parse(data);if(event.error)throw Error(typeof event.error==='string'?event.error:JSON.stringify(event.error));const delta=event.choices?.[0]?.delta;if(delta?.reasoning_content){thinking+=delta.reasoning_content;if(!reasonText){const details=document.createElement('details');details.className='reason';const summary=document.createElement('summary');summary.textContent='思考过程';reasonText=document.createElement('pre');details.append(summary,reasonText);output.box.insertBefore(details,output.content);}reasonText.textContent=thinking;}if(delta?.content){content+=delta.content;output.content.textContent=content;}if(event.choices?.[0]?.finish_reason)done=true;}
  while(true){const chunk=await reader.read();buffer+=decoder.decode(chunk.value||new Uint8Array(),{stream:!chunk.done});let index;while((index=buffer.indexOf('\n'))>=0){line(buffer.slice(0,index).trim());buffer=buffer.slice(index+1);}if(chunk.done){if(buffer.trim())line(buffer.trim());break;}}
  if(!done)throw Error('连接提前结束，请重试。');
  messages.push({role:'assistant',content});$('status').textContent='完成';
 }catch(error){messages.pop();output.content.textContent=content+(content?'\n\n':'')+(error.name==='AbortError'?'已停止。此轮未加入后续对话。':'请求失败：'+error.message);$('status').textContent='可修改消息后重新发送';$('input').value=text;}
 finally{controller=null;$('send').disabled=false;$('newChat').disabled=false;$('stop').hidden=true;$('input').focus();}
};
</script>
</html>
